<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Формулограф">
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Формулограф</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=PT+Serif:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: узкая колонка-тетрадь; сверху вкладки, в тренировке — карточка вопроса над листом в клетку */
:root{
  --bg:#E9EDF2; --surface:#FFFFFF; --sunk:#F3F5F8; --line:#D3DAE3; --grid:#E2E8F0;
  --ink:#16223A; --muted:#5D6A80; --accent:#2A4FD0; --accent-soft:#E2E8FB;
  --ok:#1E8A55; --ok-soft:#DDF2E7; --mid:#B9770E; --mid-soft:#FBEFD6; --bad:#C23B32; --bad-soft:#F8E0DE;
  --flame:#F2611D; --flame-core:#FFC233; --gold:#F5C542; --silver:#C9D1DC; --bronze:#D9965B;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"PT Serif","Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141D; --surface:#171E2A; --sunk:#121821; --line:#2A3344; --grid:#1F2735;
  --ink:#E3E8F1; --muted:#8C98AE; --accent:#8AA4FF; --accent-soft:#1E2A4D;
  --ok:#4CC98A; --ok-soft:#17352A; --mid:#E8B04A; --mid-soft:#3A2E14; --bad:#F0736A; --bad-soft:#3C1D1B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141D; --surface:#171E2A; --sunk:#121821; --line:#2A3344; --grid:#1F2735;
  --ink:#E3E8F1; --muted:#8C98AE; --accent:#8AA4FF; --accent-soft:#1E2A4D;
  --ok:#4CC98A; --ok-soft:#17352A; --mid:#E8B04A; --mid-soft:#3A2E14; --bad:#F0736A; --bad-soft:#3C1D1B;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(40px + env(safe-area-inset-bottom,0px))}
button,select{touch-action:manipulation}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.brand{display:flex;align-items:baseline;gap:10px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;letter-spacing:-.01em}
.sync{font-size:.75rem;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(4,auto);gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;max-width:100%}
nav button{border:0;background:none;color:var(--muted);font:500 .85rem var(--f-body);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
@media (max-width:480px){nav{width:100%;grid-template-columns:repeat(4,1fr)}nav button{padding:7px 4px;font-size:.8rem}}
.brand{align-items:center}
.brand .gear{margin-left:auto}
.flame{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 6px;cursor:pointer;color:var(--ink);font:700 .95rem var(--f-body);font-variant-numeric:tabular-nums}
.fl{width:1.15em;height:1.15em;flex:none}
.fl path{fill:var(--flame)}.fl .core{fill:var(--flame-core)}
.off .fl path{fill:var(--line)}.off .fl .core{fill:var(--muted);opacity:.35}
.flame.off{color:var(--muted)}
.mecard .who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mecard .who #myProf{margin-left:auto;padding:8px 14px;font-size:.85rem}
.nmbig{font-family:var(--f-display);font-size:1.15rem;font-weight:500;overflow-wrap:break-word;min-width:0}
.mestats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mestats>div{display:flex;flex-direction:column;background:var(--sunk);border-radius:10px;padding:10px 12px;min-width:0}
.mestats .v{font-family:var(--f-display);font-size:1.35rem;font-weight:500;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.mestats .k{font-size:.74rem;color:var(--muted)}
.hintline{margin:0;font-size:.78rem;color:var(--muted)}
.seg2{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;color:var(--muted);font:600 .85rem var(--f-body);padding:6px 14px;border-radius:7px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:2.2em 2.1em minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.board li:first-child{border-top:0}
.board .rk{font:600 .9rem var(--f-mono);color:var(--muted);text-align:center;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center}
.board .top1 .rk{background:var(--gold);color:#3A2A00}.board .top2 .rk{background:var(--silver);color:#22262E}.board .top3 .rk{background:var(--bronze);color:#2E1A0C}
.board .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.board .nmc{min-width:0;display:flex;flex-direction:column;gap:1px}
.ol{font:600 .68rem var(--f-body);letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.ol::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line)}
.ol.on{color:var(--ok)}
.ol.on::before{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.board .nm small{font-size:.7rem;color:var(--accent);font-weight:600;margin-left:4px}
.board .st{display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:.85rem}
.board .st.off{color:var(--muted)}
.board .pt{font-size:.8rem;color:var(--muted);text-align:right;min-width:5.5em}
.board .pt b{font-size:1rem;color:var(--ink)}
.board li.me{background:var(--accent-soft);border-radius:10px;border-top-color:transparent}
.board li.me+li{border-top-color:transparent}
.nameform{display:flex;gap:8px;flex-wrap:wrap}
.nameform input{flex:1;min-width:0;font:400 16px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.nameform input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--bad);font-size:.85rem;margin:0}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .82rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sel{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .82rem var(--f-body);padding:6px 10px;border-radius:999px;max-width:100%}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.q{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;gap:10px;flex-wrap:wrap}
.eyebrow .hist{letter-spacing:0;text-transform:none;font-weight:500}
.qtext{font-family:var(--f-display);font-weight:500;font-size:1.15rem;line-height:1.35;text-wrap:balance;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .92rem var(--f-body);padding:11px 18px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btn kbd{font:500 .7rem var(--f-mono);opacity:.6;margin-left:6px}
@media (hover:none){.btn kbd{display:none}}
.reveal{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.answer{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.answer .label{font-size:.78rem;color:var(--muted)}
.fx{font-family:var(--f-math);font-size:1.75rem;line-height:1.6;white-space:nowrap;overflow-x:auto;overflow-y:hidden;max-width:100%;scrollbar-width:none}
.fx::-webkit-scrollbar{display:none}
.fx i{font-style:italic}
.fx .fn{font-style:normal;margin:0 .08em}
.fx .op{margin:0 .25em}
.fx sub,.fx sup{font-size:.62em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.2}
.fr>span:first-child{border-bottom:.06em solid currentColor;padding:0 .18em .04em}
.fr>span:last-child{padding-top:.04em}
.sq{white-space:nowrap;display:inline-flex;align-items:center;vertical-align:middle}.sq>.rs{font-size:1.3em;line-height:1;margin-right:-.05em}.sq .rad{display:inline-block;border-top:.06em solid currentColor;padding:.12em .12em 0;margin-left:.02em}
.ai{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.9rem}
.ai .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--muted)}
.ai.ok .dot{background:var(--ok)}.ai.mid .dot{background:var(--mid)}.ai.bad .dot{background:var(--bad)}
.ai .aibody{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ai .recog{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.ai .recog .label{font-size:.78rem;color:var(--muted)}
.ai .note{font-size:.78rem;color:var(--muted)}
.ai .note:empty{display:none}
.fx.small{font-size:1.25rem}
.kbwrap{display:flex;flex-direction:column;gap:10px}
.editor{min-height:96px;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:text;overflow-x:auto}
.editor .fx{font-size:1.65rem;line-height:1.5}
.editor .ph{color:var(--muted);font-size:.9rem}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:middle;margin:0 -1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
.slot{display:inline-block;min-width:.62em;height:.95em;border:1.5px dashed var(--muted);border-radius:4px;vertical-align:middle;margin:0 .05em}
.fx sub .slot,.fx sup .slot{height:.8em}
.fx sub,.fx sup{line-height:1}
.kb{display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
.kbtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.key.caps{grid-column:span 4;font:500 1.15rem var(--f-body);background:var(--sunk);color:var(--muted)}
.key.caps[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.key.caps.lock{background:var(--accent);color:var(--surface)}
.kt{border:1px solid var(--line);background:var(--sunk);color:var(--muted);font:600 .82rem var(--f-body);padding:7px 0;border-radius:8px;cursor:pointer}
.kt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.key{height:44px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 1.2rem var(--f-math);border-radius:8px;cursor:pointer;padding:0;display:grid;place-items:center;box-shadow:0 1px 0 var(--line)}
.key i{font-style:italic}
.key:active{background:var(--accent-soft)}
.key.word{font:400 .85rem var(--f-math)}
.key.act{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-size:1.05rem}
.key.op{background:var(--sunk)}
.keys.acts{grid-template-columns:repeat(8,minmax(0,1fr))}
.keys.arrows{grid-template-columns:repeat(4,minmax(0,1fr))}
.keys.arrows .key{height:40px;font-size:1rem}
.key.nav{background:var(--sunk);font:500 .95rem var(--f-body);color:var(--muted)}
.key sub,.key sup{font-size:.6em;line-height:0;position:relative;vertical-align:baseline}.key sup{top:-.6em}.key sub{top:.35em}
.fr.mini{font-size:.62em;line-height:1.05}
.ai.thinking .dot{animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.2}}
@media (prefers-reduced-motion:reduce){.ai.thinking .dot{animation:none}}
.grade{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grade .label{font-size:.82rem;color:var(--muted);width:100%}
.g{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.g .sw{width:10px;height:10px;border-radius:3px}
.g.ok .sw{background:var(--ok)}.g.mid .sw{background:var(--mid)}.g.bad .sw{background:var(--bad)}
.g.ok[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.g.mid[aria-pressed="true"]{border-color:var(--mid);background:var(--mid-soft)}
.g.bad[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft)}
.g .sug{font-size:.7rem;font-weight:500;color:var(--muted)}
.session{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.session b{color:var(--ink);font-weight:600}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{padding:14px 16px}
.tile .v{font-family:var(--f-display);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.tile .k{font-size:.78rem;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:500;font-size:1rem;margin:0}
.sec{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sec header{padding:0;display:flex;justify-content:space-between;align-items:baseline}
.sec header span{font-size:.78rem;color:var(--muted)}
.sec>p,.sec>h2{margin:0}
.duelcard .empty{padding:0}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:.88rem}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr) auto}.row .bar{grid-column:1/-1;grid-row:2}}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.row .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.row .num b{color:var(--ink);font-weight:600;font-size:.88rem}
.weak{display:flex;flex-direction:column}
.wk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.wk:first-child{border-top:0}
.wk .t{font-size:.88rem;min-width:0}
.wk .t small{display:block;color:var(--muted);font-size:.75rem}
.wk .fx{font-size:1.2rem;grid-column:1/-1}
.pill{font:600 .75rem var(--f-mono);padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.mid{background:var(--mid-soft);color:var(--mid)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.none{background:var(--sunk);color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 8px var(--f-mono)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.legend{display:flex;gap:14px;font-size:.76rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.danger{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
/* reference */
.ref{display:flex;flex-direction:column;gap:12px}
.ref .card{padding:6px 20px 10px}
.ref h2{padding:12px 0 4px}
.ri{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.ri:first-of-type{border-top:0}
.ri .t{font-size:.86rem;color:var(--muted);min-width:0}
.ri .fx{font-size:1.3rem;grid-column:1/-1}
.ri .go{grid-row:1;grid-column:2}

/* ---------- Темы оформления (выбираются в настройках; атрибут data-skin на <html>) ---------- */
:root[data-skin="neon"][data-skin]{--bg:#07080F;--surface:#10122A;--sunk:#0B0D1F;--line:#262A55;--grid:#191C3A;--ink:#ECEEFF;--muted:#8C91C7;--accent:#2EF2D0;--accent-soft:#0C3536;--ok:#2EF2D0;--ok-soft:#0C3536;--mid:#FFD23F;--mid-soft:#3A3212;--bad:#FF3D9A;--bad-soft:#3A1030;--flame:#FF3D9A;--flame-core:#FFD23F;--gold:#FFD23F;--silver:#B8C0E0;--bronze:#E0A070;color-scheme:dark}
[data-skin="neon"] .btn.primary{color:#07080F;box-shadow:0 0 18px rgba(46,242,208,.5)}
[data-skin="neon"] .card{box-shadow:0 0 0 1px rgba(46,242,208,.08),0 0 24px rgba(120,80,255,.10)}
[data-skin="neon"] nav button[aria-selected="true"]{background:linear-gradient(90deg,#2EF2D0,#8B5CFF);color:#07080F}
[data-skin="neon"] h1{background:linear-gradient(90deg,#2EF2D0,#FF3D9A);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-skin="neon"] .g.ok[aria-pressed="true"]{box-shadow:0 0 14px rgba(46,242,208,.45)}
[data-skin="neon"] .ptsline .mult{background:#3A1030;color:#FF3D9A;box-shadow:0 0 10px rgba(255,61,154,.5)}
[data-skin="neon"] .key.act{color:#2EF2D0}

:root[data-skin="mm"][data-skin]{--bg:#F2EADA;--surface:#FBF6EC;--sunk:#F1E7D4;--line:#E1CCB0;--grid:#EBD9C2;--ink:#3A2819;--muted:#8A715A;--accent:#C8502D;--accent-soft:#F7DCCF;--ok:#3E8A4F;--ok-soft:#DDEBD6;--mid:#B7791F;--mid-soft:#F4E3C4;--bad:#B83A2E;--bad-soft:#F4D6D0;--flame:#C8502D;--flame-core:#F2A65A;color-scheme:light}
[data-skin="mm"] body{background-image:linear-gradient(rgba(200,80,45,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(200,80,45,.13) 1px,transparent 1px),linear-gradient(rgba(200,80,45,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(200,80,45,.06) 1px,transparent 1px);background-size:40px 40px,40px 40px,8px 8px,8px 8px}
[data-skin="mm"] .card{box-shadow:0 1px 0 var(--line)}

.crown{margin-right:4px;display:inline-block;transform:translateY(-1px)}
.pins{display:flex;gap:6px;width:100%}
.mcounts{display:flex;flex-wrap:wrap;gap:10px 16px}

.profhead{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}

.fx.multi{display:flex;flex-wrap:wrap;gap:4px 18px;white-space:normal}

.av.emo{font-size:1.15rem}

.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.skin .pv b{display:block;height:9px;width:62%;border-radius:4px}

.filters .seg2{flex:none}
.qfx{font-size:2rem;padding-top:4px}

.eyebrow .combo.hot{color:var(--flame)}
.eyebrow .combo .fl{width:1.1em;height:1.1em}
.quiz{display:grid;grid-template-columns:1fr;gap:8px}

.opt .on{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--sunk);color:var(--muted);display:grid;place-items:center;font:600 .78rem var(--f-mono)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fx.plain{font:600 1.05rem/1.35 var(--f-body);white-space:normal}
.ptsline{font:600 .95rem var(--f-body);color:var(--ink);display:flex;gap:8px;align-items:center}

.srsnote{margin:0;font-size:.82rem;color:var(--accent)}

.mine{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.85rem}
.mine .label{color:var(--muted);font-size:.78rem;width:100%}
.board .bd{font-size:.72rem;color:var(--muted);font-weight:600;margin-left:6px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.ach .ic{width:2.2em;height:2.2em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;gap:1px;background:var(--line);color:var(--muted);font:700 .85rem var(--f-math);margin-bottom:4px}
.ach .ic .fl{width:1em;height:1em}

.ach.got .ic .fl path{fill:var(--flame-core)}
.ach .an{font-weight:600;font-size:.86rem}
.ach .ad{font-size:.74rem;color:var(--muted);line-height:1.3}

.ach .ap i{display:block;height:100%;background:var(--accent)}
.ach .av{font:500 .7rem var(--f-mono);color:var(--muted)}
.ach:not(.got){opacity:.85}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-size:.9rem}

 ["mkt", "В сосуде содержится разреженный аргон, абсолютная температура которого равна 150 К. Концентрацию аргона уменьшили в 2 раза, при этом его давление увеличилось в 3 раза. Определите абсолютную температуру газа в конечном равновесном состоянии.", ["mkt-1"], "p = nkT ⇒ T = p/(nk): давление ×3, концентрация ÷2 — температура ×6.", "900 К", "ФИПИ, демоверсия ЕГЭ 2025, задание 7"],
 ["dyn", "При исследовании зависимости модуля силы трения скольжения Fтр от модуля нормальной составляющей силы реакции опоры N получили: при N = 2 Н сила трения 0,8 Н; при 4 Н — 1,6 Н; при 6 Н — 2,4 Н; при 8 Н — 3,2 Н. Определите по результатам исследования коэффициент трения скольжения.", ["dyn-4"], "Fтр = μN ⇒ μ = Fтр/N = 0,8/2.", "0,4", "ФИПИ, демоверсия ЕГЭ 2025, задание 2 (данные таблицы записаны текстом)"],
 ["stat", "Медный кубик, подвешенный на нити, полностью погружён в воду и не касается дна сосуда. Ребро кубика равно 3 см. Определите силу Архимеда, действующую на кубик.", ["stat-3"], "F = ρgV, где V = (0,03 м)³ = 2,7·10⁻⁵ м³.", "0,27 Н", "ФИПИ, демоверсия ЕГЭ 2025, задание 4"],
 ["cons", "При равномерном прямолинейном перемещении саней по горизонтальному участку пути на 50 м постоянная горизонтально направленная сила тяги совершает работу 500 Дж. Какова сила трения?", ["cons-5"], "Движение равномерное, значит сила трения равна силе тяги: F = A/s = 500/50.", "10 Н", "ФИПИ, демоверсия ЕГЭ 2026, задание 3"],
 ["osc", "Массивный шарик, подвешенный на лёгкой пружине, совершает свободные гармонические колебания вдоль вертикальной прямой. Во сколько раз нужно увеличить массу шарика, чтобы период колебаний увеличился в 1,5 раза?", ["osc-0"], "T = 2π√(m/k): чтобы период вырос в 1,5 раза, масса должна вырасти в 1,5² раза.", "в 2,25 раза", "ФИПИ, демоверсия ЕГЭ 2026, задание 4"],
 ["mag", "Проволочная рамка вращается в постоянном однородном магнитном поле вокруг оси, перпендикулярной вектору магнитной индукции. Ось вращения лежит в плоскости рамки. Магнитный поток, пронизывающий поверхность, ограниченную рамкой, изменяется по закону Φ = 4·10⁻⁷·cos 100πt, где все величины выражены в СИ. Модуль вектора магнитной индукции равен 2 мТл. Определите площадь рамки. Ответ дайте в см².", ["mag-2"], "Φmax = BS = 4·10⁻⁷ Вб, откуда S = Φmax/B = 4·10⁻⁷/(2·10⁻³) м².", "2 см²", "ФИПИ, демоверсия ЕГЭ 2026, задание 12"],
 ["cons", "Камень массой 1,5 кг брошен вертикально вверх. В начальный момент его кинетическая энергия равна 300 Дж. На какую максимальную высоту поднимется камень над точкой старта? Сопротивлением воздуха пренебречь.", ["cons-11", "cons-3", "cons-2"], "Eк = mgh ⇒ h = Eк/(mg) = 300/15.", "20 м", "ФИПИ, демоверсия ЕГЭ 2027, задание 3"],

 ["cons", "Потенциальная энергия упругой пружины при её растяжении на 2 см равна 2 Дж. Найдите модуль изменения потенциальной энергии этой пружины при уменьшении её растяжения на 0,5 см.", ["cons-4"], "E = kx²/2 ∝ x²: при 1,5 см энергия 2·(1,5/2)² = 1,125 Дж, изменение 2 − 1,125.", "0,875 Дж", "ФИПИ, демоверсия ЕГЭ 2023, задание 3"],
 ["stat", "Коромысло весов, к которому подвешены на нитях два груза, находится в равновесии. Массу первого груза увеличили в 2 раза. Во сколько раз нужно уменьшить плечо d₁ первого груза, чтобы равновесие сохранилось? Коромысло и нити считать невесомыми.", ["stat-1"], "m₁g·d₁ = m₂g·d₂: масса ×2 — плечо надо уменьшить в 2 раза.", "в 2 раза", "ФИПИ, демоверсия ЕГЭ 2024, задание 4"],

 ["kin", "Координата x тела меняется с течением времени t согласно закону x = 23 + 5t − 2t², где все величины выражены в СИ. Определите проекцию aₓ ускорения этого тела.", ["kin-2"], "Сравни с x = x₀ + v₀t + at²/2: a/2 = −2.", "−4 м/с²", "ФИПИ, открытый банк заданий, задание 3CF615"],
 ["kin", "Начальная скорость движения тела равна 5 м/с. Сколько потребуется времени, чтобы увеличить его скорость в 3 раза при равноускоренном движении по прямой в одном направлении на пути в 20 м?", ["kin-3", "kin-4"], "a = (v² − v₀²)/(2s) = (225 − 25)/40 = 5 м/с², затем t = (v − v₀)/a.", "2 с", "ФИПИ, открытый банк заданий, задание B5F7C7"],
 ["kin", "Какой путь пройдёт тело за 2 с, двигаясь по прямой в одном направлении, если его скорость за это время уменьшается в 3 раза? Модуль ускорения тела равен 5 м/с².", ["kin-4", "kin-2"], "v₀ − v = at = 10 и v₀ = 3v, значит v = 5, v₀ = 15 м/с; s = (v₀ + v)t/2.", "20 м", "ФИПИ, открытый банк заданий, задание A32BC5"],
 ["kin", "Материальная точка равномерно движется по окружности радиусом 2 м с центростремительным ускорением, равным 2 м/с². Определите скорость точки.", ["kin-5"], "a = v²/R ⇒ v = √(aR) = √4.", "2 м/с", "ФИПИ, открытый банк заданий, задание 8A3445"],
 ["kin", "Шарик движется по окружности радиусом R с угловой скоростью ω. Во сколько раз уменьшится центростремительное ускорение шарика, если радиус окружности увеличить в 2 раза, а угловую скорость уменьшить в 2 раза?", ["kin-16"], "a = ω²R: ω² даёт ÷4, R — ×2.", "в 2 раза", "ФИПИ, открытый банк заданий, задание B5CFF9"],
 ["kin", "Расстояние между пунктами А и В равно 30 км. Из пункта А в направлении пункта В выезжает мотоциклист со скоростью 50 км/ч. Одновременно из пункта В в том же направлении, что и мотоциклист, выезжает трактор со скоростью 20 км/ч. На каком расстоянии от пункта А мотоциклист догонит трактор?", ["kin-0", "kin-15"], "Скорость сближения 50 − 20 = 30 км/ч, догонит через t = 30/30 = 1 ч, за это время мотоциклист проедет 50 км.", "50 км", "ФИПИ, открытый банк заданий, задание 5E532C"],
 ["kin", "Человек услышал звук грома через 8 с после вспышки молнии. Считая, что скорость звука в воздухе равна 340 м/с, определите, на каком расстоянии от человека ударила молния.", ["kin-0"], "Свет приходит практически мгновенно: s = vt = 340·8.", "2720 м", "ФИПИ, открытый банк заданий, задание A784FF"],
 ["dyn", "В инерциальной системе отсчёта некоторая сила сообщает телу массой 8 кг ускорение 5 м/с². Какова масса тела, которому та же сила сообщает в той же системе отсчёта ускорение 4 м/с²?", ["dyn-0"], "F = ma = 40 Н, тогда m = F/a = 40/4.", "10 кг", "ФИПИ, открытый банк заданий, задание 249978"],
 ["dyn", "В инерциальной системе отсчёта сила величиной 9 Н сообщает телу массой 3 кг ускорение a. Какой должна быть масса тела, чтобы сила, равная 18 Н, сообщала ему в той же системе отсчёта ускорение 4a?", ["dyn-0"], "a = 9/3 = 3 м/с², 4a = 12 м/с², m = F/a = 18/12.", "1,5 кг", "ФИПИ, открытый банк заданий, задание 41AB52"],
 ["dyn", "Два маленьких шарика массой m каждый находятся на расстоянии 40 см друг от друга. Каково расстояние между шариками вдвое большей массы, если модуль сил гравитационного взаимодействия между ними такой же, как и между первыми двумя шариками?", ["dyn-2"], "F = Gm₁m₂/r²: массы дают ×4, значит r² тоже ×4, r ×2.", "80 см", "ФИПИ, открытый банк заданий, задание 9F5549"],
 ["dyn", "Расстояние от искусственного спутника до поверхности Земли равно двум радиусам Земли. Во сколько раз увеличится сила притяжения спутника к Земле, если расстояние от него до поверхности Земли станет равным одному радиусу Земли?", ["dyn-2", "dyn-7"], "Расстояние до центра Земли меняется с 3R на 2R: F ∝ 1/r², (3/2)² = 2,25.", "в 2,25 раза", "ФИПИ, открытый банк заданий, задание AC8852"],
 ["dyn", "У поверхности Луны на космонавта действует сила тяготения 120 Н. Какая сила тяготения действует со стороны Луны на того же космонавта в космическом корабле, движущемся по круговой орбите вокруг Луны на расстоянии двух лунных радиусов от её центра?", ["dyn-2"], "Расстояние до центра выросло в 2 раза — сила уменьшилась в 4 раза.", "30 Н", "ФИПИ, открытый банк заданий, задание BA66EA"],
 ["dyn", "Сила притяжения Земли к Солнцу в 2,88 раза больше, чем сила притяжения Меркурия к Солнцу. Найдите отношение расстояния между Меркурием и Солнцем к расстоянию между Землёй и Солнцем, если масса Земли в 18 раз больше массы Меркурия.", ["dyn-2"], "F_З/F_М = (m_З/m_М)·(r_М/r_З)² ⇒ 18·x² = 2,88, x² = 0,16.", "0,4", "ФИПИ, открытый банк заданий, задание 59B436"],
 ["dyn", "Пружина жёсткостью 2·10⁴ Н/м одним концом закреплена в штативе. На какую величину она растянется под действием силы 400 Н?", ["dyn-3"], "x = F/k = 400/(2·10⁴) м.", "2 см", "ФИПИ, открытый банк заданий, задание 401B9F"],
 ["dyn", "Ящик массой 10 кг равномерно движется по прямой по горизонтальной поверхности под действием постоянной горизонтальной силы тяги величиной 25 Н. Каков коэффициент трения между ящиком и поверхностью?", ["dyn-13", "dyn-4"], "Движение равномерное — Fтр = Fтяги = 25 Н, μ = Fтр/(mg) = 25/100.", "0,25", "ФИПИ, открытый банк заданий, задание BA974A"],
 ["dyn", "Кирпич массой 4 кг лежит на горизонтальной кладке стены, покрытой раствором, оказывая на неё давление 1250 Па. Какова площадь грани, на которой лежит кирпич?", ["dyn-8", "dyn-1"], "p = F/S, F = mg = 40 Н ⇒ S = 40/1250.", "0,032 м²", "ФИПИ, открытый банк заданий, задание 05875D"],
 ["dyn", "Груз массой 200 г подвешен на пружине к потолку неподвижного лифта. Лифт начинает двигаться и в течение 2 с равноускоренно опускается вниз на расстояние 5 м. Каково удлинение пружины при опускании лифта, если её жёсткость 100 Н/м? Движение груза также считать равноускоренным, возникновением колебаний пренебречь.", ["dyn-9", "dyn-3", "kin-2"], "a = 2s/t² = 2,5 м/с², сила упругости kx = m(g − a) = 1,5 Н, x = 1,5/100 м.", "1,5 см", "ФИПИ, открытый банк заданий, задание 89A46D"],

 ["stat", "Какова сила давления керосина, заполняющего цистерну, на заплату в её стене, находящуюся на глубине 2 м? Площадь заплаты 10 см². Атмосферное давление не учитывать.", ["stat-2", "dyn-8"], "p = ρgh = 800·10·2 = 16 000 Па, F = pS = 16 000·10⁻³.", "16 Н", "ФИПИ, открытый банк заданий, задание 0EFE20"],

 ["stat", "Полый стальной шар массой 10 кг плавает на поверхности озера. Объём шара равен 15 дм³. Чему равна сила Архимеда, действующая на шар?", ["dyn-1"], "Шар плавает — сила Архимеда уравновешивает силу тяжести: F = mg.", "100 Н", "ФИПИ, открытый банк заданий, задание 176001"],

 ["stat", "На кусок алюминия массой 0,54 кг при полном погружении в воду действует сила Архимеда, равная 2 Н. Чему равна при этом масса вытесненной воды?", ["stat-3", "dyn-1"], "Сила Архимеда равна весу вытесненной воды: m = F/g = 2/10.", "0,2 кг", "ФИПИ, открытый банк заданий, задание 2EF7AF"],
 ["cons", "Тело массой 6 кг движется прямолинейно со скоростью 2 м/с в инерциальной системе отсчёта. На тело начала действовать постоянная тормозящая сила, равная по модулю 4 Н. Сколько времени пройдёт до момента остановки тела?", ["cons-1", "cons-0"], "Импульс p = mv = 12 кг·м/с должен стать нулём: t = Δp/F = 12/4.", "3 с", "ФИПИ, открытый банк заданий, задание 568701"],
 ["cons", "Тело движется в инерциальной системе отсчёта по прямой в одном направлении под действием постоянной силы величиной 5 Н. За 4 с импульс тела увеличился и стал равен 35 кг·м/с. Чему был равен первоначальный импульс тела?", ["cons-1"], "Δp = FΔt = 20 кг·м/с, p₀ = 35 − 20.", "15 кг·м/с", "ФИПИ, открытый банк заданий, задание 8CAE7B"],
 ["cons", "Отношение импульса легкового автомобиля к импульсу мотоцикла p₁/p₂ = 5. Каково отношение их скоростей υ₁/υ₂, если отношение массы легкового автомобиля к массе мотоцикла m₁/m₂ = 2,5?", ["cons-0"], "p = mv ⇒ υ₁/υ₂ = (p₁/p₂)/(m₁/m₂) = 5/2,5.", "2", "ФИПИ, открытый банк заданий, задание 72C7F7"],
 ["cons", "Легковой автомобиль и грузовик движутся со скоростями υ₁ = 90 км/ч и υ₂ = 60 км/ч соответственно. Масса легкового автомобиля m = 1500 кг. Какова масса грузового автомобиля, если отношение модуля импульса грузовика к модулю импульса легкового автомобиля равно 2?", ["cons-0"], "m₂·60 = 2·1500·90 ⇒ m₂ = 270 000/60.", "4500 кг", "ФИПИ, открытый банк заданий, задание F46783"],
 ["cons", "Сталкиваются и слипаются два разных по массе пластилиновых шарика, причём векторы их скоростей непосредственно перед столкновением направлены навстречу друг другу и одинаковы по модулю: υ₁ = υ₂ = 1 м/с. Во сколько раз масса тяжёлого шарика больше, чем лёгкого, если сразу после столкновения их скорость стала равной (по модулю) 0,5 м/с?", ["cons-10"], "(M − m)·1 = (M + m)·0,5 ⇒ 0,5M = 1,5m.", "в 3 раза", "ФИПИ, открытый банк заданий, задание 8CED26"],
 ["cons", "Снаряд массой 2 кг, летящий со скоростью 200 м/с, разрывается на два осколка. Первый осколок массой 1 кг летит под углом 90° к первоначальному направлению со скоростью 300 м/с. Найдите скорость второго осколка.", ["cons-0"], "Импульс сохраняется: вдоль полёта 400 кг·м/с, поперёк 300 кг·м/с; у второго осколка p = √(400² + 300²) = 500 кг·м/с, υ = p/m.", "500 м/с", "ФИПИ, открытый банк заданий, задание 5E35A7"],
 ["cons", "Тело массой 0,1 кг вращается в горизонтальной плоскости на нити длиной 1 м. Чему равна работа силы тяжести за один оборот вращения тела?", ["cons-5", "cons-12"], "Сила тяжести перпендикулярна перемещению (высота не меняется): cos 90° = 0.", "0 Дж", "ФИПИ, открытый банк заданий, задание 354CDE"],
 ["cons", "Два тела движутся с одинаковой скоростью. Кинетическая энергия первого тела в 4 раза меньше кинетической энергии второго тела. Определите отношение m₁/m₂ масс тел.", ["cons-2"], "При одинаковой скорости E ∝ m.", "0,25", "ФИПИ, открытый банк заданий, задание 7998DB"],
 ["cons", "Первая пружина имеет жёсткость 20 Н/м, вторая — 40 Н/м. Первая растянута на 2 см, вторая — на 1 см. Чему равно отношение потенциальной энергии второй пружины к потенциальной энергии первой E₂/E₁?", ["cons-4"], "E = kx²/2: E₂/E₁ = (40·1²)/(20·2²).", "0,5", "ФИПИ, открытый банк заданий, задание 1C4DA4"],
 ["cons", "При упругой деформации, равной 3 см, потенциальная энергия пружины равна 6 Дж. На сколько изменится потенциальная энергия этой пружины при увеличении упругой деформации ещё на 3 см?", ["cons-4"], "E ∝ x²: при 6 см энергия 6·4 = 24 Дж, изменение 24 − 6.", "на 18 Дж", "ФИПИ, открытый банк заданий, задание ADA046"],
 ["cons", "Шарик массой 100 г падает с некоторой высоты. Начальная скорость шарика равна нулю. Его кинетическая энергия при падении на землю равна 6 Дж, а потеря энергии за счёт сопротивления воздуха составила 1 Дж. С какой высоты упал шарик?", ["cons-3", "cons-11"], "Начальная энергия mgh = 6 + 1 = 7 Дж ⇒ h = 7/(0,1·10).", "7 м", "ФИПИ, открытый банк заданий, задание E9E545"],
 ["cons", "Автомобиль с выключенным двигателем сняли со стояночного тормоза, и он покатился под уклон, составляющий угол 30° с горизонтом. В начале горизонтального участка дороги, который следует за спуском, его скорость составляет 10 м/с. Какое расстояние автомобиль проезжает по склону? Трением пренебречь.", ["cons-11", "cons-3", "cons-2"], "mgh = mv²/2 ⇒ h = v²/(2g) = 5 м; путь по склону s = h/sin 30°.", "10 м", "ФИПИ, открытый банк заданий, задание B34015"],
 ["cons", "Мальчик на санках спустился с ледяной горы высотой 10 м и проехал по горизонтали до остановки 50 м. Чему равен коэффициент трения санок по горизонтальной поверхности? Считать, что по склону горы санки скользили без трения.", ["cons-3", "cons-5", "dyn-13"], "mgh = μmg·s ⇒ μ = h/s = 10/50.", "0,2", "ФИПИ, открытый банк заданий, задание 2785A3"],
 ["cons", "При выстреле из пружинного пистолета вертикально вверх шарик массой 100 г поднимается на высоту 2 м. Какова жёсткость пружины, если до выстрела она была сжата на 5 см? Сопротивление воздуха движению шарика не учитывать.", ["cons-4", "cons-3", "cons-11"], "kx²/2 = mgh = 2 Дж ⇒ k = 4/0,05².", "1600 Н/м", "ФИПИ, открытый банк заданий, задание B3B917"],
 ["osc", "Во сколько раз уменьшится частота малых свободных колебаний математического маятника, если длину нити увеличить в 9 раз, а массу груза уменьшить в 4 раза?", ["osc-1"], "T = 2π√(l/g) от массы не зависит; l ×9 — период ×3, частота ÷3.", "в 3 раза", "ФИПИ, открытый банк заданий, задание C36A4C"],
 ["osc", "Груз, подвешенный на лёгкой пружине жёсткостью 400 Н/м, совершает свободные вертикальные гармонические колебания. Пружину какой жёсткости надо взять вместо первой пружины, чтобы период свободных колебаний этого груза стал в 2 раза меньше?", ["osc-0"], "T = 2π√(m/k): чтобы T ÷2, k должна вырасти в 4 раза.", "1600 Н/м", "ФИПИ, открытый банк заданий, задание B86809"],
 ["osc", "Период свободных колебаний пружинного маятника равен 0,5 с. Каким станет период свободных колебаний этого маятника, если массу груза маятника увеличить в 2 раза, а жёсткость пружины вдвое уменьшить?", ["osc-0"], "T ∝ √(m/k): m/k вырастает в 4 раза — период в 2 раза.", "1 с", "ФИПИ, открытый банк заданий, задание 6DEE76"],
 ["osc", "Период свободных малых колебаний математического маятника равен 1,6 с. Каким станет период колебаний, если массу груза увеличить в 4 раза?", ["osc-1"], "T = 2π√(l/g) от массы груза не зависит.", "1,6 с", "ФИПИ, открытый банк заданий, задание 8c8B86"],
 ["osc", "Звуковая волна частотой 2 кГц распространяется в среде со скоростью 340 м/с. Чему равна длина звуковой волны?", ["osc-4"], "λ = v/ν = 340/2000.", "0,17 м", "ФИПИ, открытый банк заданий, задание 4e8F5A"],
 ["osc", "Мужской голос бас занимает частотный интервал от ν₁ = 80 Гц до ν₂ = 320 Гц. Чему равно отношение длин звуковых волн λ₁/λ₂, соответствующих границам этого интервала?", ["osc-4"], "λ = v/ν: λ₁/λ₂ = ν₂/ν₁ = 320/80.", "4", "ФИПИ, открытый банк заданий, задание 407C39"],
 ["osc", "Во сколько раз увеличится частота свободных электромагнитных колебаний в контуре, если площадь пластин конденсатора, входящего в состав контура, уменьшить в 9 раз, а индуктивность катушки увеличить в 4 раза?", ["osc-2", "es-4"], "C ∝ S — ёмкость ÷9; LC уменьшится в 9/4 раза, период T = 2π√(LC) — в 1,5 раза, частота вырастет в 1,5 раза.", "в 1,5 раза", "ФИПИ, открытый банк заданий, задание 0A8805"],
 ["osc", "Конденсатор, заряженный до напряжения U₀, в первый раз подключили к катушке с индуктивностью L, а во второй — к катушке с индуктивностью 4L. В обоих случаях в контуре возникли свободные незатухающие электромагнитные колебания. Каково отношение амплитуд силы тока I₂max/I₁max при этих колебаниях?", ["osc-10"], "q²max/(2C) = LI²max/2, qmax = CU₀ одинаков ⇒ Imax ∝ 1/√L.", "0,5", "ФИПИ, открытый банк заданий, задание 93A417"],
 ["osc", "В двух идеальных колебательных контурах с одинаковой индуктивностью происходят свободные электромагнитные колебания, причём период колебаний в первом контуре 9·10⁻⁸ с, во втором 3·10⁻⁸ с. Во сколько раз амплитудное значение силы тока во втором контуре больше, чем в первом, если максимальный заряд конденсаторов в обоих случаях одинаков?", ["osc-10", "osc-2"], "Из энергии Imax = qmax/√(LC), а √(LC) = T/(2π) ⇒ Imax ∝ 1/T.", "в 3 раза", "ФИПИ, открытый банк заданий, задание CBF6C6"],
 ["mkt", "В ходе эксперимента давление разреженного газа в сосуде снизилось в 5 раз, а средняя энергия теплового движения его молекул уменьшилась в 2 раза. Во сколько раз уменьшилась при этом концентрация молекул газа в сосуде?", ["mkt-1", "mkt-2"], "p = nkT и E ∝ T, значит p ∝ nE: n = p/E уменьшилась в 5/2 раза.", "в 2,5 раза", "ФИПИ, открытый банк заданий, задание 3AB2B2"],
 ["mkt", "Температура неона увеличилась с 27 °С до 177 °С. Во сколько раз увеличилась средняя кинетическая энергия его молекул?", ["mkt-2", "mkt-23"], "E ∝ T в кельвинах: 450 К / 300 К.", "в 1,5 раза", "ФИПИ, открытый банк заданий, задание 4C6FA1"],
 ["mkt", "Во сколько раз уменьшится абсолютная температура разреженного одноатомного газа, если среднеквадратичная скорость теплового движения его молекул уменьшится в 5 раз?", ["mkt-17"], "v = √(3kT/m₀): T ∝ v², 5² = 25.", "в 25 раз", "ФИПИ, открытый банк заданий, задание 54C671"],
 ["mkt", "При уменьшении абсолютной температуры на 600 К средняя кинетическая энергия теплового движения молекул аргона уменьшилась в 4 раза. Какова конечная температура аргона?", ["mkt-2"], "E ∝ T: T₀ − 600 = T₀/4 ⇒ T₀ = 800 К, конечная 200 К.", "200 К", "ФИПИ, открытый банк заданий, задание DC7C46"],
 ["mkt", "В сосуде неизменного объёма находится идеальный газ в количестве 1 моль. Во сколько раз увеличится давление газа на стенки сосуда, если добавить в сосуд ещё 3 моль того же газа, а абсолютную температуру газа уменьшить в 2 раза?", ["mkt-3"], "pV = νRT: ν ×4, T ÷2 — давление ×2.", "в 2 раза", "ФИПИ, открытый банк заданий, задание CA98BA"],
 ["mkt", "При температуре T₀ и давлении p₀ 3 моль идеального газа занимают объём 6V₀. Сколько моль газа будут занимать объём V₀ при температуре 2T₀ и давлении 2p₀?", ["mkt-3"], "ν = pV/(RT): p₀·6V₀/(RT₀) = 3, значит p₀V₀/(RT₀) = 0,5; новое ν = 2p₀·V₀/(R·2T₀).", "0,5 моль", "ФИПИ, открытый банк заданий, задание 03BD78"],
 ["mkt", "С идеальным газом провели изотермический процесс, в котором в результате увеличения объёма газа на 300 дм³ его давление уменьшилось в 2 раза. Масса газа постоянна. Каким был первоначальный объём газа?", ["mkt-18"], "pV = const: объём вырос в 2 раза, V₀ + 300 = 2V₀.", "300 дм³", "ФИПИ, открытый банк заданий, задание AB117F"],
 ["mkt", "С идеальным газом происходит изохорный процесс, в котором в результате увеличения абсолютной температуры газа в 2 раза его давление возросло на 75 кПа. Масса газа постоянна. Каково было первоначальное давление газа?", ["mkt-20"], "p ∝ T: давление удвоилось, значит прирост равен начальному давлению.", "75 кПа", "ФИПИ, открытый банк заданий, задание 67AF6A"],
 ["mkt", "В закрытом сосуде под поршнем находится водяной пар при температуре 100 °С под давлением 40 кПа. Каким станет давление пара, если, сохраняя его температуру неизменной, уменьшить объём пара в 3 раза?", ["mkt-18", "mkt-13"], "По pV = const вышло бы 120 кПа, но давление насыщенного пара при 100 °С равно 100 кПа — дальше пар конденсируется.", "100 кПа", "ФИПИ, открытый банк заданий, задание 480A51"],
 ["mkt", "Относительная влажность воздуха в цилиндре под поршнем равна 34 %. Воздух изотермически сжали, уменьшив его объём в 3 раза. Какова относительная влажность воздуха в цилиндре после сжатия?", ["mkt-13", "mkt-18"], "Давление пара выросло бы втрое (102 %), но влажность не может превысить 100 % — пар станет насыщенным.", "100 %", "ФИПИ, открытый банк заданий, задание 4E55D4"],
 ["mkt", "Какую массу льда, находящегося при 0 °С, можно превратить в воду, если льду сообщить количество теплоты 0,33·10⁵ Дж?", ["mkt-8"], "m = Q/λ = 0,33·10⁵/3,3·10⁵.", "0,1 кг", "ФИПИ, открытый банк заданий, задание 192F48"],
 ["mkt", "Идеальный одноатомный газ находится в сосуде с жёсткими стенками объёмом 0,6 м³. При охлаждении его давление снизилось на 3·10³ Па. На сколько уменьшилась внутренняя энергия газа?", ["mkt-4", "mkt-3"], "U = 3/2·νRT = 3/2·pV ⇒ ΔU = 3/2·V·Δp = 1,5·0,6·3000.", "на 2700 Дж", "ФИПИ, открытый банк заданий, задание EE7CA0"],
 ["mkt", "При остывании чугунной болванки с 450 до 80 °С выделилось количество теплоты, равное 44 400 кДж. Чему равна масса этой болванки?", ["mkt-7"], "m = Q/(cΔt) = 44 400 000/(500·370).", "240 кг", "ФИПИ, открытый банк заданий, задание 154098"],
 ["mkt", "Кусок льда опустили в термос с водой. Начальная температура льда равна 0 °С, исходная масса воды — 1100 г. Теплоёмкостью термоса можно пренебречь. При переходе к тепловому равновесию часть льда массой 420 г растаяла. Чему равна начальная температура воды в термосе?", ["mkt-7", "mkt-8"], "Лёд остался — равновесие при 0 °С. λm = c·M·t: 3,3·10⁵·0,42 = 4200·1,1·t.", "30 °С", "ФИПИ, открытый банк заданий, задание 6C915C"],
 ["mkt", "Для охлаждения лимонада в него бросают кубики льда, имеющие температуру 0 °С. Масса каждого кубика — 8 г. Первоначальная температура лимонада равна 30 °С. После того как в лимонад бросили четыре кубика льда, установилась температура 15 °С. Сколько лимонада было в стакане? Ответ в граммах округлите до целых. Удельная теплоёмкость лимонада равна удельной теплоёмкости воды.", ["mkt-7", "mkt-8"], "Лёд (32 г) тает и талая вода греется до 15 °С: λm + cm·15 = c·M·15 ⇒ 10 560 + 2016 = 63 000·M.", "200 г", "ФИПИ, открытый банк заданий, задание 4FD162"],
 ["mkt", "Газ в сосуде сжали, совершив работу, равную 500 Дж. Внутренняя энергия газа при этом увеличилась на 350 Дж. Какое количество теплоты отдал газ окружающей среде?", ["mkt-6"], "Q = ΔU + A_газа = 350 − 500 = −150 Дж: газ отдал 150 Дж.", "150 Дж", "ФИПИ, открытый банк заданий, задание 5AD1F4"],
 ["mkt", "При изобарном расширении постоянной массы неона при нормальном атмосферном давлении ему сообщили количество теплоты, равное 200 кДж. Определите изменение объёма неона.", ["mkt-6", "mkt-5", "mkt-25"], "Для одноатомного газа при p = const: Q = ΔU + A = 3/2·pΔV + pΔV = 5/2·pΔV ⇒ ΔV = 200 000/(2,5·10⁵).", "0,8 м³", "ФИПИ, открытый банк заданий, задание DE8578"],
 ["mkt", "При изобарном нагревании газообразный гелий получил количество теплоты 100 Дж. Какую работу совершил газ? Масса гелия в процессе нагревания не менялась.", ["mkt-6", "mkt-5"], "Q = 3/2·pΔV + pΔV = 5/2·A ⇒ A = 2/5·Q.", "40 Дж", "ФИПИ, открытый банк заданий, задание 426924"],
 ["mkt", "Рабочее тело теплового двигателя за цикл совершает работу, равную 15 кДж, и получает от нагревателя количество теплоты, равное 75 кДж. Какое количество теплоты рабочее тело отдаёт холодильнику за цикл?", ["mkt-24"], "A = Q₁ − Q₂ ⇒ Q₂ = 75 − 15.", "60 кДж", "ФИПИ, открытый банк заданий, задание 80CCD9"],
 ["mkt", "У идеального теплового двигателя Карно температура нагревателя равна 227 °С, а температура холодильника равна 27 °С. Определите КПД теплового двигателя.", ["mkt-12", "mkt-23"], "η = (T₁ − T₂)/T₁ = (500 − 300)/500.", "40 %", "ФИПИ, открытый банк заданий, задание 0D600A"],
 ["mkt", "Рабочее тело тепловой машины за цикл совершает работу 50 Дж и отдаёт холодильнику количество теплоты, равное 150 Дж. Чему равен КПД тепловой машины?", ["mkt-11", "mkt-24"], "Q₁ = A + Q₂ = 200 Дж, η = 50/200.", "25 %", "ФИПИ, открытый банк заданий, задание ADCC5E"],
 ["mkt", "У идеального теплового двигателя Карно температура нагревателя 400 К, температура холодильника 300 К. За один цикл двигатель совершает работу 16 кДж. Какое количество теплоты получает рабочее тело от нагревателя за один цикл?", ["mkt-12"], "η = (400 − 300)/400 = 0,25, Q₁ = A/η = 16/0,25.", "64 кДж", "ФИПИ, открытый банк заданий, задание EC33AF"],
 ["es", "Одинаковые отрицательные точечные заряды, модуль которых |q| = 2·10⁻⁸ Кл, расположены в вакууме на расстоянии 3 м друг от друга. Определите модуль сил взаимодействия этих зарядов друг с другом.", ["es-0"], "F = kq²/r² = 9·10⁹·4·10⁻¹⁶/9.", "4·10⁻⁷ Н", "ФИПИ, открытый банк заданий, задание 3BB12E"],

/* ---------- Рендер мини-разметки ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const UP = new Set(["sin","cos","tg","ctg","min","max","lg","ln"]);
const LET = /[A-Za-zαβγδεηθλμνπρστφχψωΓΦΩℰ]/;
function fx(s, text) {
  let i = 0, out = "";
  const group = () => {
    if (s[i] === "{") { let d = 1, j = i + 1; while (j < s.length && d) { if (s[j] === "{") d++; else if (s[j] === "}") d--; j++; } const g = s.slice(i + 1, j - 1); i = j; return g; }
    return s[i++] || "";
  };
  while (i < s.length) {
    const c = s[i];
    if (c === "\\") {
      const k = s[i + 1]; i += 2;
      if (k === "f") { const a = group(), b = group(); out += text ? `(${fx(a,1)})/(${fx(b,1)})` : `<span class="fr"><span>${fx(a)}</span><span>${fx(b)}</span></span>`; }
      else if (k === "s") { const a = group(); out += text ? `√(${fx(a,1)})` : `<span class="sq"><span class="rs">√</span><span class="rad">${fx(a)}</span></span>`; }
      continue;
    }
    if (c === "_" || c === "^") { i++; const g = group(); out += text ? `${c}{${fx(g,1)}}` : (c === "_" ? `<sub>${fx(g)}</sub>` : `<sup>${fx(g)}</sup>`); continue; }
    if (LET.test(c)) { let j = i; while (j < s.length && LET.test(s[j])) j++; const w = s.slice(i, j); i = j; out += text ? w : (UP.has(w) ? `<span class="fn">${w}</span>` : `<i>${w}</i>`); continue; }
    if (c === "[" || c === "]") { i++; continue; }
    if (c === "*") { out += "·"; i++; continue; }
    if (c === "=" && !text) { out += '<span class="op">=</span>'; i++; continue; }
    out += text ? c : esc(c); i++;
  }
  return out;
}

function record(id, r, pts) {

}

async function ensurePhotos(ids, rerender) {

  if (!need.length || !lbOn()) return;
  need.forEach(id => photoPending.add(id));
  try {
    const rows = await api(`avatars?select=player_id,img&player_id=in.(${need.join(",")})`);
    for (const r of rows || []) if (validPhoto(r.img)) photoCache.set(r.player_id, r.img);
    rerender();
  } catch (e) { /* база ещё без фото — остаются буквы */ }
  need.forEach(id => { photoPending.delete(id); if (!photoCache.has(id)) photoCache.set(id, null); });
}
async function uploadPhoto(file) {
  if (!me.name) { toast("<span>Сначала придумай ник во вкладке «Рейтинг»</span>"); return; }
  if (!lbOn()) return;
  const st = $("avStatus"); if (st) st.textContent = "Загружаю…";
  try {
    const url = URL.createObjectURL(file), img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const S = 128, c = document.createElement("canvas"); c.width = c.height = S;
    const g = c.getContext("2d"), m = Math.min(img.naturalWidth, img.naturalHeight);
    g.drawImage(img, (img.naturalWidth - m) / 2, (img.naturalHeight - m) / 2, m, m, 0, 0, S, S);
    URL.revokeObjectURL(url);
    let q = 0.82, data = c.toDataURL("image/jpeg", q);
    while (data.length > 38000 && q > 0.35) { q -= 0.1; data = c.toDataURL("image/jpeg", q); }
    await api("rpc/set_avatar", { method: "POST", body: JSON.stringify({ p_id: me.id, p_secret: me.secret, p_name: me.name, p_img: data }) });
    me.photo = data; me.avatar = "photo:" + Date.now().toString(36); saveMe(); syncScore(); renderSettings();

  }
}

function boardEntries() {
  const today = dayKey(), yest = yesterdayKey(), by = new Map();
  const from = lbPeriod === "day" ? today : lbPeriod === "week" ? weekDays()[0] : dayKey(monthStart());
  for (const r of lbRows || []) {
    if (r.day < from || r.day > today) continue;
    const e = by.get(r.player_id) || { id: r.player_id, name: r.name, pts: 0, n: 0, last: "", streak: 0, badges: 0, avatar: "" };
    e.pts += r.points; e.n += r.attempts;
    if (r.day > e.last) { e.last = r.day; e.name = r.name; e.streak = r.day >= yest ? r.streak : 0; e.badges = r.badges || 0; e.avatar = r.avatar || ""; }

  }
  return [...by.values()].filter(e => e.n > 0 || e.id === me.id).sort((a, b) => b.pts - a.pts || b.n - a.n || a.name.localeCompare(b.name));

const duelLink = code => location.origin + location.pathname + "#duel-" + code;
const fmtTime = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function rememberDuel(code) {
  state.duels = (state.duels || []).filter(d => d.code !== code);
  state.duels.unshift({ code, at: Date.now() });
  state.duels = state.duels.slice(0, 15); persist();
}
async function shareDuel(code) {
  const url = duelLink(code), text = "Вызываю на дуэль по формулам физики! 10 формул: кто больше и быстрее.";
  if (navigator.share) { try { await navigator.share({ title: "Дуэль · Формулограф", text, url }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(url); toast("<span>Ссылка на дуэль скопирована</span>"); }
  catch { toast(`<span>Скопируй ссылку: ${esc(url)}</span>`); }
}
function duelScreen(on) {

    <p class="empty">10 одинаковых формул для всех, кто откроет ссылку. Побеждает больше верных, при равенстве — кто быстрее.</p>

    ${mine.length ? `<div class="mine"><span class="label">Мои дуэли</span>${mine.map(x => `<a class="link" href="#duel-${esc(x.code)}">${esc(x.code)} · ${new Date(x.at).toLocaleDateString("ru-RU", { day: "numeric", month: "short" })}</a>`).join("")}</div>` : ""}
  </div>`;
}
function route() {
  const m = location.hash.match(/^#duel-([A-Za-z0-9]{6})$/);
  if (m && lbOn()) openDuel(m[1].toUpperCase());
}
window.addEventListener("hashchange", route);

/* ---------- Медали за рейтинг ----------
   За каждый законченный день и каждую законченную неделю: 1–3 места, если играли хотя бы двое.
   Медаль: { k: "d" | "w" | "m", p: 1 | 2 | 3, d: "ГГГГ-ММ-ДД" (день, понедельник недели или 1-е число месяца) }. */
const MEDAL_METAL = ["", "Золото", "Серебро", "Бронза"];
const medalId = m => m.k + "-" + m.d;
const fmtDay = d => new Date(d + "T12:00").toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
function medalTitle(m) {
  const wk = d => { const e = new Date(d + "T12:00"); e.setDate(e.getDate() + 6); return `${fmtDay(d)} – ${fmtDay(dayKey(e))}`; };
  if (m.k === "d") return `${MEDAL_METAL[m.p]} дня · ${fmtDay(m.d)}`;
  if (m.k === "w") return `${MEDAL_METAL[m.p]} недели · ${wk(m.d)}`;
  if (m.k === "m") return `${MEDAL_METAL[m.p]} месяца · ${new Date(m.d + "T12:00").toLocaleDateString("ru-RU", { month: "long", year: "numeric" })}`;
  if (m.k === "h") return `Хет-трик · 3 золота подряд, по ${fmtDay(m.d)}`;
  return `Доминатор · 5+ золотых дней, ${wk(m.d)}`;
}
// картинки медалей лежат в папке medals/
function medalSVG(m, size = 34) {
  const key = m.k === "h" || m.k === "x" ? m.k : m.k + m.p;
  return `<img class="medal" src="medals/${key}.webp?v=3" width="${size}" height="${size}" alt="" decoding="async">`;
}
const medalCounts = list => { const c = { dg: 0, ds: 0, db: 0, wg: 0, ws: 0, wb: 0, mg: 0, ms: 0, mb: 0, h: 0, x: 0 }; for (const m of list) { if (m.k === "h" || m.k === "x") c[m.k]++; else c[m.k + "gsb"[m.p - 1]]++; } return c; };
let medalsBusy = false;
async function updateMedals(force) {
  if (!lbOn() || !me.name || medalsBusy) return;
  const today = dayKey();
  if (!force && state.medalsAt === today) return;
  medalsBusy = true;
  try {
    const f = new Date(); f.setDate(f.getDate() - 63);
    const from = dayKey(weekStart(monthStart(f))); // целые недели и целые месяцы
    const rows = await api(`scores?select=player_id,day,points,attempts&day=gte.${from}&day=lt.${today}&limit=20000`);
    const curWeek = dayKey(weekStart()), curMonth = dayKey(monthStart());
    const byDay = new Map(), byWeek = new Map(), byMonth = new Map();
    for (const r of rows || []) {
      if (!(r.attempts > 0) || !(r.points > 0)) continue;
      const d = byDay.get(r.day) || new Map(); d.set(r.player_id, (d.get(r.player_id) || 0) + r.points); byDay.set(r.day, d);
      const mo = dayKey(monthStart(new Date(r.day + "T12:00")));
      if (mo >= from && mo < curMonth) { const mm = byMonth.get(mo) || new Map(); mm.set(r.player_id, (mm.get(r.player_id) || 0) + r.points); byMonth.set(mo, mm); }
      const w = dayKey(weekStart(new Date(r.day + "T12:00")));
      if (w >= curWeek) continue;
      const wk = byWeek.get(w) || new Map(); wk.set(r.player_id, (wk.get(r.player_id) || 0) + r.points); byWeek.set(w, wk);
    }
    const fresh = [];
    const place = (map, k, d) => {
      if (map.size < 2 || !map.has(me.id)) return;
      const mine = map.get(me.id), p = 1 + [...map.values()].filter(v => v > mine).length;
      if (p <= 3) fresh.push({ k, p, d });
    };
    for (const [d, m] of byDay) place(m, "d", d);
    for (const [w, m] of byWeek) place(m, "w", w);
    for (const [mo, m] of byMonth) place(m, "m", mo);
    const golds = fresh.filter(m => m.k === "d" && m.p === 1).map(m => m.d).sort();
    let run = 0;
    golds.forEach((d, i) => {
      const prev = i ? new Date(golds[i - 1] + "T12:00") : null; if (prev) prev.setDate(prev.getDate() + 1);
      run = prev && dayKey(prev) === d ? run + 1 : 1;
      if (run % 3 === 0) fresh.push({ k: "h", p: 1, d });
    });
    const perWeek = new Map(); for (const d of golds) { const w = dayKey(weekStart(new Date(d + "T12:00"))); if (w < curWeek) perWeek.set(w, (perWeek.get(w) || 0) + 1); }
    for (const [w, n] of perWeek) if (n >= 5) fresh.push({ k: "x", p: 1, d: w });
    // старше окна пересчёта — оставляем как было
    state.medals = [...(state.medals || []).filter(m => m.d < from), ...fresh].sort((a, b) => b.d.localeCompare(a.d) || a.k.localeCompare(b.k));
    state.pinned = (state.pinned || []).filter(id => state.medals.some(m => medalId(m) === id));
    state.medalsAt = today; persist(); checkAch(); syncProfile();
    if (activeView === "prof" && profileOf && profileOf.id === me.id) openProfile(me.id, me.name, myAv());
  } catch (e) { /* без сети — попробуем в следующий раз */ }
  medalsBusy = false;
}
function togglePin(id) {
  state.pinned = state.pinned || [];
  if (state.pinned.includes(id)) state.pinned = state.pinned.filter(x => x !== id);
  else if (state.pinned.length >= 3) { toast("<span>Выставить можно до 3 медалей — сначала убери одну</span>"); return; }
  else state.pinned.push(id);
  persist(); syncProfile(); openProfile(me.id, me.name, myAv());
}
function medalsSectionHTML(st, mine) {
  const c = st.med, total = Object.values(c).reduce((a, b) => a + b, 0);
  const counts = [["x", 1, "x", "доминатор"], ["h", 1, "h", "хет-трик"], ["m", 1, "mg", "месяца"], ["m", 2, "ms", "месяца"], ["m", 3, "mb", "месяца"], ["w", 1, "wg", "недели"], ["w", 2, "ws", "недели"], ["w", 3, "wb", "недели"], ["d", 1, "dg", "дня"], ["d", 2, "ds", "дня"], ["d", 3, "db", "дня"]]
    .filter(x => c[x[2]]).map(([k, p, key, cap]) => `<span class="mcount">${medalSVG({ k, p }, 36)}<b>×${c[key]}</b><small>${cap}</small></span>`).join("");
  const list = mine ? state.medals || [] : st.recent;
  const pins = mine ? state.pinned || [] : st.pin.map(medalId);
  const grid = list.map(m => { const id = medalId(m), on = pins.includes(id);
    return `<${mine ? "button" : "div"} class="mitem${on ? " pinned" : ""}" ${mine ? `data-mid="${esc(id)}" aria-pressed="${on}"` : ""}>${medalSVG(m, 56)}<span>${esc(medalTitle(m))}</span>${on ? `<small>выставлена</small>` : ""}</${mine ? "button" : "div"}>`; }).join("");
  return `<div class="card sec"><header><h2>Медали</h2><span>${total ? `всего ${total}` : ""}</span></header>
    ${total ? `<div class="mcounts">${counts}</div>` : `<p class="empty">${mine ? "Займи 1–3 место в рейтинге за день, неделю или месяц — медаль появится здесь на следующий день." : "Пока нет медалей."}</p>`}
    ${mine && list.length ? `<p class="hintline">Нажми на медаль, чтобы выставить её в профиле (до 3 штук).</p>` : ""}
    ${grid ? `<div class="mgrid">${grid}</div>` : ""}</div>`;
}

/* ---------- Профили ----------
   Каждый игрок отправляет короткую сводку своей статистики; профиль друга собирается из неё. */
function myProfileStats() {
  const days = Object.keys(state.days).sort();
  const sec = {};
  for (const [k] of SECTIONS) {
    let n = 0, ok = 0, mid = 0;
    for (const f of F) if (f.sec === k && state.f[f.id]) { const s = state.f[f.id]; n += s.n; ok += s.ok; mid += s.mid; }
    if (n) sec[k] = [ok, mid, n];
  }
  const week = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); week.push(dayPts(state.days[dayKey(d)])); }
  return {
    v: 1, since: days[0] || dayKey(), n: sumDays("n"), ok: sumDays("ok"), mid: sumDays("mid"),
    pts: Object.values(state.days).reduce((a, d) => a + dayPts(d), 0), active: days.length,
    streak: streak(), bestStreak: bestStreak(), bestCombo: state.bestCombo || 0,
    learned: Object.values(state.f).filter(s => boxOf(s) >= 3).length, seen: F.filter(f => state.f[f.id]).length,
    med: medalCounts(state.medals || []), pin: (state.medals || []).filter(m => (state.pinned || []).includes(medalId(m))).slice(0, 3), recent: (state.medals || []).slice(0, 12),
    duelWins: (state.duelWins || []).length, ach: Object.keys(state.ach || {}).filter(id => ACH.some(a => a.id === id)), sec, week
  };
}
let profileSent = "";
async function syncProfile() {
  if (!lbOn() || !me.name) return;
  const stats = myProfileStats(), body = JSON.stringify(stats);
  if (body === profileSent) return;
  try { await api("rpc/set_profile", { method: "POST", body: JSON.stringify({ p_id: me.id, p_secret: me.secret, p_name: me.name, p_stats: stats }) }); profileSent = body; }
  catch (e) { /* база ещё без профилей */ }
}
// значения из чужого профиля — только числа и известные ключи
const num = (x, max = 1e7) => Number.isFinite(+x) ? Math.max(0, Math.min(max, Math.round(+x))) : 0;
const validMedal = m => m && ["d", "w", "m", "h", "x"].includes(m.k) && [1, 2, 3].includes(m.p) && /^\d{4}-\d{2}-\d{2}$/.test(m.d);
function cleanStats(x) {
  if (!x || typeof x !== "object") return null;
  const sec = {};
  for (const [k] of SECTIONS) if (Array.isArray(x.sec && x.sec[k])) sec[k] = x.sec[k].slice(0, 3).map(v => num(v));
  return {
    since: /^\d{4}-\d{2}-\d{2}$/.test(x.since) ? x.since : null, n: num(x.n), ok: num(x.ok), mid: num(x.mid), pts: num(x.pts), active: num(x.active),
    streak: num(x.streak), bestStreak: num(x.bestStreak), bestCombo: num(x.bestCombo), learned: num(x.learned), seen: num(x.seen), duelWins: num(x.duelWins),
    ach: Array.isArray(x.ach) ? x.ach.filter(id => ACH.some(a => a.id === id)) : [], sec,
    med: Object.fromEntries(["dg", "ds", "db", "wg", "ws", "wb", "mg", "ms", "mb", "h", "x"].map(k => [k, num(x.med && x.med[k], 1e5)])),
    pin: Array.isArray(x.pin) ? x.pin.filter(validMedal).slice(0, 3).map(m => ({ k: m.k, p: m.p, d: m.d })) : [],
    recent: Array.isArray(x.recent) ? x.recent.filter(validMedal).slice(0, 12).map(m => ({ k: m.k, p: m.p, d: m.d })) : [],
    week: Array.isArray(x.week) ? x.week.slice(-7).map(v => num(v)) : []
  };
}
let profileOf = null; // { id, name, avatar }
async function openProfile(id, name, avatar) {
  profileOf = { id, name, avatar };
  show("prof");
  if (id === me.id) { renderProfile(cleanStats(myProfileStats()), me.name, myAv(), id); return; }
  $("view-prof").innerHTML = `<div class="card sec"><p class="empty">Загружаю профиль…</p></div>`;
  let st = null;
  try { const r = await api(`profiles?select=stats&player_id=eq.${id}`); st = r && r[0] ? cleanStats(r[0].stats) : null; } catch (e) {}
  try { const r = await api(`scores?select=updated_at&player_id=eq.${id}&order=updated_at.desc&limit=1`); const t = r && r[0] ? Date.parse(r[0].updated_at) || 0 : 0; if (t > (lastSeen.get(id) || 0)) lastSeen.set(id, t); } catch (e) {}
  if (profileOf && profileOf.id === id) renderProfile(st, name, avatar, id);
}
function renderProfile(st, name, avatar, id) {
  const el = $("view-prof"), mine = id === me.id;
  const back = `<div><button class="link" id="profBack">← Назад</button></div>`;
  const head = `<div class="card sec profhead">${avHTML(avatar, name, "big", id)}<div class="t"><span class="nmbig">${esc(name)}${statusHTML(avatar)}</span>${olHTML(id)}
    ${st && st.since ? `<small>в игре с ${new Date(st.since + "T12:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" })}</small>` : ""}</div>
    ${mine ? `<button class="btn" id="profEdit">Изменить</button>` : ""}
    ${st && st.pin.length ? `<div class="pins">${st.pin.map(m => `<span title="${esc(medalTitle(m))}">${medalSVG(m, 48)}</span>`).join("")}</div>` : ""}</div>`;
  if (!st) {
    el.innerHTML = back + head + `<div class="card sec"><p class="empty">Профиль ещё не заполнился. Он появится, когда ${esc(name)} откроет обновлённое приложение.</p></div>`;
    wireProfile(); return;
  }
  const acc = st.n ? Math.round((st.ok + st.mid * .5) / st.n * 100) : null;
  const tile = (v, k) => `<div class="card tile"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  const tiles = `<div class="tiles">
    ${tile(`<span class="flamev${st.streak ? "" : " off"}">${FLAME}${st.streak}</span>`, `${plural(st.streak, "день", "дня", "дней")} подряд · рекорд ${st.bestStreak}`)}
    ${tile(`${BOLT}${st.pts}`, "Дж за всё время")}
    ${tile(acc === null ? "—" : acc + "%", `точность, ${st.n} ${plural(st.n, "ответ", "ответа", "ответов")}`)}
    ${tile(st.learned, `${plural(st.learned, "формула выучена", "формулы выучены", "формул выучено")} · видел ${st.seen}`)}
    ${tile(st.bestCombo, "лучшее комбо")}
    ${tile(st.duelWins, plural(st.duelWins, "победа в дуэлях", "победы в дуэлях", "побед в дуэлях"))}
  </div>`;
  const got = ACH.filter(a => st.ach.includes(a.id));
  const achs = `<div class="card sec"><header><h2>Достижения</h2><span>${got.length} из ${ACH.length}</span></header>
    ${got.length ? `<div class="achs">${got.map(a => `<div class="ach got"><span class="ic">${achIcon(a)}</span><span class="an">${esc(a.name)}</span><span class="ad">${esc(a.desc)}</span></div>`).join("")}</div>` : `<p class="empty">Пока ни одного.</p>`}</div>`;
  const secRows = SECTIONS.filter(([k]) => st.sec[k]).map(([k, n]) => { const [ok, mid, all] = st.sec[k]; const bad = Math.max(0, all - ok - mid); const p = x => (x / all * 100).toFixed(1) + "%";
    return `<div class="row"><span class="nm">${n}</span><div class="bar"><i style="width:${p(ok)};background:var(--ok)"></i><i style="width:${p(mid)};background:var(--mid)"></i><i style="width:${p(bad)};background:var(--bad)"></i></div><span class="num"><b>${Math.round((ok + mid * .5) / all * 100)}%</b> · ${all}</span></div>`; }).join("");
  const W = 20, H = 60, max = Math.max(20, ...st.week);
  const lbl = i => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d.toLocaleDateString("ru-RU", { weekday: "short" }); };
  const bars = st.week.map((v, i) => { const h = v / max * H, x = i * (W + 18) + 6; return `<rect x="${x}" y="${10 + H - h}" width="${W}" height="${Math.max(h, 1)}" rx="3" fill="${v ? "var(--accent)" : "var(--line)"}"/>${v ? `<text x="${x + W / 2}" y="${6 + H - h}" text-anchor="middle">${v}</text>` : ""}<text x="${x + W / 2}" y="${H + 24}" text-anchor="middle">${lbl(i)}</text>`; }).join("");
  el.innerHTML = back + head + tiles + medalsSectionHTML(st, mine)
    + `<div class="card sec"><header><h2>Энергия за неделю</h2><span>${st.week.reduce((a, b) => a + b, 0)} Дж</span></header><svg class="chart" viewBox="0 0 ${7 * (W + 18)} ${H + 30}" role="img" aria-label="Джоули по дням">${bars}</svg></div>`
    + achs
    + (secRows ? `<div class="card sec"><header><h2>Разделы</h2><span>точность · ответов</span></header><div class="rows">${secRows}</div></div>` : "");
  wireProfile();
  if ((parseAv(avatar) || {}).photo) ensurePhotos([id], () => profileOf && profileOf.id === id && renderProfile(st, name, avatar, id));
}
function wireProfile() {
  $("profBack").onclick = () => show(profileBack || "lb");
  const e = $("profEdit"); if (e) e.onclick = () => show("set");
  document.querySelectorAll("#view-prof .mitem[data-mid]").forEach(b => b.onclick = () => togglePin(b.dataset.mid));
}
let profileBack = "lb";
// нажатие на строку в рейтинге или в таблице дуэли открывает профиль
document.addEventListener("click", e => {
  const li = e.target.closest && e.target.closest("li[data-pid]");
  if (!li) return;
  profileBack = activeView;
  openProfile(li.dataset.pid, li.dataset.name || "Игрок", li.dataset.av || "");
});

renderFlame();
syncScore();
nextQuestion();
syncing.then(() => updateMedals());
renderCombo();
if (/^#duel-/.test(location.hash)) route();
else if (state.activeDuel && lbOn()) openDuel(state.activeDuel.code);
checkAch();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>

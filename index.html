<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Формулограф">
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Формулограф</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=PT+Serif:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: узкая колонка-тетрадь; сверху вкладки, в тренировке — карточка вопроса над листом в клетку */
:root{
  --bg:#E9EDF2; --surface:#FFFFFF; --sunk:#F3F5F8; --line:#D3DAE3; --grid:#E2E8F0;
  --ink:#16223A; --muted:#5D6A80; --accent:#2A4FD0; --accent-soft:#E2E8FB;
  --ok:#1E8A55; --ok-soft:#DDF2E7; --mid:#B9770E; --mid-soft:#FBEFD6; --bad:#C23B32; --bad-soft:#F8E0DE;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"PT Serif","Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141D; --surface:#171E2A; --sunk:#121821; --line:#2A3344; --grid:#1F2735;
  --ink:#E3E8F1; --muted:#8C98AE; --accent:#8AA4FF; --accent-soft:#1E2A4D;
  --ok:#4CC98A; --ok-soft:#17352A; --mid:#E8B04A; --mid-soft:#3A2E14; --bad:#F0736A; --bad-soft:#3C1D1B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141D; --surface:#171E2A; --sunk:#121821; --line:#2A3344; --grid:#1F2735;
  --ink:#E3E8F1; --muted:#8C98AE; --accent:#8AA4FF; --accent-soft:#1E2A4D;
  --ok:#4CC98A; --ok-soft:#17352A; --mid:#E8B04A; --mid-soft:#3A2E14; --bad:#F0736A; --bad-soft:#3C1D1B;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(40px + env(safe-area-inset-bottom,0px))}
button,select{touch-action:manipulation}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.brand{display:flex;align-items:baseline;gap:10px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;letter-spacing:-.01em}
.sync{font-size:.75rem;color:var(--muted)}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
nav button{border:0;background:none;color:var(--muted);font:500 .88rem var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .82rem var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sel{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .82rem var(--f-body);padding:6px 10px;border-radius:999px;max-width:100%}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.q{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;gap:10px;flex-wrap:wrap}
.eyebrow .hist{letter-spacing:0;text-transform:none;font-weight:500}
.qtext{font-family:var(--f-display);font-weight:500;font-size:1.15rem;line-height:1.35;text-wrap:balance;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .92rem var(--f-body);padding:11px 18px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btn kbd{font:500 .7rem var(--f-mono);opacity:.6;margin-left:6px}
@media (hover:none){.btn kbd{display:none}}
.reveal{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.answer{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.answer .label{font-size:.78rem;color:var(--muted)}
.fx{font-family:var(--f-math);font-size:1.75rem;line-height:1.6;white-space:nowrap;overflow-x:auto;max-width:100%}
.fx i{font-style:italic}
.fx .fn{font-style:normal;margin:0 .08em}
.fx .op{margin:0 .25em}
.fx sub,.fx sup{font-size:.62em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.2}
.fr>span:first-child{border-bottom:.06em solid currentColor;padding:0 .18em .04em}
.fr>span:last-child{padding-top:.04em}
.sq{white-space:nowrap;display:inline-flex;align-items:center;vertical-align:middle}.sq>.rs{font-size:1.3em;line-height:1;margin-right:-.05em}.sq .rad{display:inline-block;border-top:.06em solid currentColor;padding:.12em .12em 0;margin-left:.02em}
.ai{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.9rem}
.ai .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--muted)}
.ai.ok .dot{background:var(--ok)}.ai.mid .dot{background:var(--mid)}.ai.bad .dot{background:var(--bad)}
.ai .aibody{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ai .recog{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.ai .recog .label{font-size:.78rem;color:var(--muted)}
.ai .note{font-size:.78rem;color:var(--muted)}
.ai .note:empty{display:none}
.fx.small{font-size:1.25rem}
.kbwrap{display:flex;flex-direction:column;gap:10px}
.editor{min-height:96px;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:text;overflow-x:auto}
.editor .fx{font-size:1.65rem;line-height:1.5}
.editor .ph{color:var(--muted);font-size:.9rem}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:middle;margin:0 -1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
.slot{display:inline-block;min-width:.62em;height:.95em;border:1.5px dashed var(--muted);border-radius:4px;vertical-align:middle;margin:0 .05em}
.fx sub .slot,.fx sup .slot{height:.8em}
.fx sub,.fx sup{line-height:1}
.kb{display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
.kbtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.kt{border:1px solid var(--line);background:var(--sunk);color:var(--muted);font:600 .82rem var(--f-body);padding:7px 0;border-radius:8px;cursor:pointer}
.kt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.key{height:44px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 1.2rem var(--f-math);border-radius:8px;cursor:pointer;padding:0;display:grid;place-items:center;box-shadow:0 1px 0 var(--line)}
.key i{font-style:italic}
.key:active{background:var(--accent-soft)}
.key.word{font:400 .85rem var(--f-math)}
.key.act{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-size:1.05rem}
.key.op{background:var(--sunk)}
.key.nav{background:var(--sunk);font:500 .95rem var(--f-body);color:var(--muted)}
.key sub,.key sup{font-size:.6em}
.fr.mini{font-size:.62em;line-height:1.05}
.ai.thinking .dot{animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.2}}
@media (prefers-reduced-motion:reduce){.ai.thinking .dot{animation:none}}
.grade{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grade .label{font-size:.82rem;color:var(--muted);width:100%}
.g{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.g .sw{width:10px;height:10px;border-radius:3px}
.g.ok .sw{background:var(--ok)}.g.mid .sw{background:var(--mid)}.g.bad .sw{background:var(--bad)}
.g.ok[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.g.mid[aria-pressed="true"]{border-color:var(--mid);background:var(--mid-soft)}
.g.bad[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft)}
.g .sug{font-size:.7rem;font-weight:500;color:var(--muted)}
.session{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.session b{color:var(--ink);font-weight:600}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{padding:14px 16px}
.tile .v{font-family:var(--f-display);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.tile .k{font-size:.78rem;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:500;font-size:1rem;margin:0}
.sec{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sec header{padding:0;display:flex;justify-content:space-between;align-items:baseline}
.sec header span{font-size:.78rem;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:.88rem}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr) auto}.row .bar{grid-column:1/-1;grid-row:2}}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.row .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.row .num b{color:var(--ink);font-weight:600;font-size:.88rem}
.weak{display:flex;flex-direction:column}
.wk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.wk:first-child{border-top:0}
.wk .t{font-size:.88rem;min-width:0}
.wk .t small{display:block;color:var(--muted);font-size:.75rem}
.wk .fx{font-size:1.2rem;grid-column:1/-1}
.pill{font:600 .75rem var(--f-mono);padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.mid{background:var(--mid-soft);color:var(--mid)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.none{background:var(--sunk);color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 8px var(--f-mono)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.legend{display:flex;gap:14px;font-size:.76rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.danger{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
/* reference */
.ref{display:flex;flex-direction:column;gap:12px}
.ref .card{padding:6px 20px 10px}
.ref h2{padding:12px 0 4px}
.ri{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.ri:first-of-type{border-top:0}
.ri .t{font-size:.86rem;color:var(--muted);min-width:0}
.ri .fx{font-size:1.3rem;grid-column:1/-1}
.ri .go{grid-row:1;grid-column:2}
.link{border:0;background:none;color:var(--accent);font:500 .8rem var(--f-body);cursor:pointer;padding:2px 0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand"><h1>Формулограф</h1><span class="sync">тренажёр формул по физике</span></div>
    <nav role="tablist">
      <button role="tab" id="tab-train" aria-selected="true" data-view="train">Тренировка</button>
      <button role="tab" id="tab-stats" aria-selected="false" data-view="stats">Статистика</button>
      <button role="tab" id="tab-ref" aria-selected="false" data-view="ref">Формулы</button>
    </nav>
  </header>

  <section class="panel" id="view-train">
    <div class="filters">
      <select class="sel" id="secSel" aria-label="Раздел"></select>
      <button class="chip" id="modeRand" aria-pressed="false">Вперемешку</button>
      <button class="chip" id="modeWeak" aria-pressed="true">Сначала слабые</button>
    </div>

    <div class="card q">
      <div class="eyebrow"><span id="qSec">Раздел</span><span class="hist" id="qHist"></span></div>
      <p class="qtext" id="qText">Вопрос</p>
    </div>

    <div id="kbWrap" class="kbwrap">
      <div class="card editor" id="editor" aria-label="Твой ответ"></div>
      <div class="kb" id="kb">
        <div class="kbtabs" id="kbTabs"></div>
        <div class="keys" id="kbKeys"></div>
        <div class="keys acts">
          <button class="key act" data-a="frac" title="Дробь"><span class="fr mini"><span>□</span><span>□</span></span></button>
          <button class="key act" data-a="sqrt" title="Корень">√□</button>
          <button class="key act" data-a="sub" title="Нижний индекс"><i>x</i><sub>□</sub></button>
          <button class="key act" data-a="sup" title="Степень"><i>x</i><sup>□</sup></button>
          <button class="key op" data-a="=">=</button>
          <button class="key op" data-a="+">+</button>
          <button class="key op" data-a="−">−</button>
          <button class="key nav" data-a="left" title="Влево">◀</button>
          <button class="key nav" data-a="right" title="Вправо / выйти из дроби">▶</button>
          <button class="key nav" data-a="back" title="Стереть">⌫</button>
        </div>
      </div>
    </div>

    <div class="actions" id="preActions">
      <button class="btn primary" id="checkBtn">Проверить<kbd>Enter</kbd></button>
      <button class="btn" id="giveUp">Не помню</button>
    </div>

    <div class="card reveal" id="reveal" hidden>
      <div class="answer"><span class="label">Правильно:</span><div class="fx" id="ansFx"></div></div>
      <div class="ai" id="ai" hidden><span class="dot"></span><div class="aibody"><span id="aiText"></span><div class="recog"><span class="label">Твой ответ:</span><span class="fx small" id="aiRec"></span></div><span class="note" id="aiNote"></span></div></div>
      <div class="grade">
        <span class="label">Как получилось?</span>
        <button class="g ok" data-r="2" aria-pressed="false"><span class="sw"></span>Верно<span class="sug"></span></button>
        <button class="g mid" data-r="1" aria-pressed="false"><span class="sw"></span>С недочётом<span class="sug"></span></button>
        <button class="g bad" data-r="0" aria-pressed="false"><span class="sw"></span>Неверно<span class="sug"></span></button>
      </div>
      <div class="actions"><button class="btn primary" id="nextBtn" disabled>Дальше<kbd>Enter</kbd></button></div>
    </div>

    <div class="session" id="session"></div>
  </section>

  <section class="panel" id="view-stats" hidden></section>
  <section class="ref" id="view-ref" hidden></section>
</div>

<script>
/* ---------- Формулы ----------
   Мини-разметка: \f{числитель}{знаменатель}, \s{подкоренное}, _x или _{xx}, ^x или ^{xx}, * = точка умножения */
const SECTIONS = [
 ["kin","Кинематика"],["dyn","Динамика"],["cons","Законы сохранения"],["stat","Статика и гидростатика"],
 ["mkt","МКТ и термодинамика"],["es","Электростатика"],["dc","Постоянный ток"],["mag","Магнетизм и индукция"],
 ["osc","Колебания и волны"],["opt","Оптика"],["qnt","Квантовая и ядерная физика"]
];
const RAW = {
 kin:[
  ["Скорость при равномерном прямолинейном движении","v = \\f{s}{t}"],
  ["Скорость при равноускоренном движении (через v₀, a, t)","v = v_0 + at"],
  ["Перемещение при равноускоренном движении (через v₀, a, t)","s = v_0t + \\f{at^2}{2}"],
  ["Перемещение при равноускоренном движении без времени","s = \\f{v^2 − v_0^2}{2a}"],
  ["Ускорение (через скорости и время)","a = \\f{v − v_0}{t}"],
  ["Центростремительное ускорение (через скорость и радиус)","a_ц = \\f{v^2}{R}"],
  ["Угловая скорость через период","ω = \\f{2π}{T}"],
  ["Связь линейной и угловой скорости","v = ωR"],
  ["Частота через период","ν = \\f{1}{T}"],
  ["Высота при свободном падении без начальной скорости","h = \\f{gt^2}{2}"],
  ["Дальность полёта тела, брошенного горизонтально с высоты h","L = v_0\\s{\\f{2h}{g}}"]
 ],
 dyn:[
  ["Второй закон Ньютона","F = ma"],
  ["Сила тяжести","F = mg"],
  ["Закон всемирного тяготения","F = G\\f{m_1m_2}{r^2}"],
  ["Закон Гука (сила упругости)","F = kx"],
  ["Сила трения скольжения","F_{тр} = μN"],
  ["Вес тела в лифте, движущемся с ускорением вверх","P = m(g + a)"],
  ["Первая космическая скорость (через g и R)","v = \\s{gR}"],
  ["Ускорение свободного падения на высоте h над планетой","g = G\\f{M}{(R + h)^2}"],
  ["Давление (через силу и площадь)","p = \\f{F}{S}"]
 ],
 cons:[
  ["Импульс тела","p = mv"],
  ["Импульс силы (второй закон Ньютона в импульсной форме)","FΔt = Δp"],
  ["Кинетическая энергия","E_к = \\f{mv^2}{2}"],
  ["Потенциальная энергия тела, поднятого над землёй","E_п = mgh"],
  ["Потенциальная энергия упруго деформированной пружины","E_п = \\f{kx^2}{2}"],
  ["Механическая работа силы","A = Fs cos α"],
  ["Мощность (через работу и время)","N = \\f{A}{t}"],
  ["Мощность через силу и скорость","N = Fv"],
  ["КПД механизма","η = \\f{A_п}{A_з}[*100%]"],
  ["Теорема о кинетической энергии","A = E_{к2} − E_{к1}"]
 ],
 stat:[
  ["Момент силы","M = Fl"],
  ["Правило рычага (условие равновесия)","F_1l_1 = F_2l_2"],
  ["Гидростатическое давление жидкости","p = ρgh"],
  ["Сила Архимеда","F_A = ρ_жgV_т"],
  ["Плотность вещества","ρ = \\f{m}{V}"],
  ["Гидравлический пресс","\\f{F_1}{S_1} = \\f{F_2}{S_2}"]
 ],
 mkt:[

  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function swapTop(list) {
  const k = list.findIndex(n => isOp(n, "="));
  return k < 0 ? null : [...list.slice(k + 1), list[k], ...list.slice(0, k)];
}
function checkTyped(user, src) {
  if (!user.length) return { verdict: 0, diff: null };
  const variants = [parseSrc(src, true), parseSrc(src, false)];
  if (variants.some(v => sameExpr(user, v))) return { verdict: 2, diff: 0 };
  const us = [user, swapTop(user)].filter(Boolean).map(u => flat(u));
  let best = Infinity, W = 1;
  for (const v of variants) { const f = flat(v); for (const u of us) { const d = editDist(u, f); if (d < best) { best = d; W = f.filter(t => !t.endsWith("{") && t !== "}").length; } } }
  return { verdict: best <= Math.max(1, Math.round(W * 0.2)) ? 1 : 0, diff: best };
}

function histText(id) {
  const s = state.f[id];
  if (!s) return "новая формула";
  return `раньше: ${s.ok} из ${s.n} верно`;
}
function nextQuestion() {
  current = pick();
  recent.push(current.id); if (recent.length > 4) recent.shift();
  $("qSec").textContent = SEC_NAME[current.sec];
  $("qHist").textContent = histText(current.id);
  $("qText").textContent = current.q;
  phase = "draw"; grade = null;
  eClear(); $("kbWrap").hidden = false; keyset = "abc"; renderKeys();
  $("reveal").hidden = true; $("preActions").hidden = false; $("ai").hidden = true;
  document.querySelectorAll(".g").forEach(b => { b.setAttribute("aria-pressed", "false"); b.querySelector(".sug").textContent = ""; });
  $("nextBtn").disabled = true;
}
function setGrade(r) {
  grade = r;
  document.querySelectorAll(".g").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.r === r)));
  $("nextBtn").disabled = false;
}
function reveal(gaveUp) {
  phase = "reveal";
  $("ansFx").innerHTML = fx(current.src);
  $("preActions").hidden = true; $("reveal").hidden = false;
  document.querySelectorAll(".g .sug").forEach(x => x.textContent = "");
  {
    $("kbWrap").hidden = true;
    const r = gaveUp ? { verdict: 0 } : checkTyped(eroot, current.src);
    const box = $("ai");
    box.hidden = !!gaveUp; box.className = "ai " + ["bad", "mid", "ok"][r.verdict];
    $("aiText").textContent = r.verdict === 2 ? "Верно!" : r.verdict === 1
      ? `Почти: ${r.diff} ${plural(r.diff, "символ отличается", "символа отличаются", "символов отличаются")}.`
      : (eroot.length ? "Не совпадает с правильной формулой." : "Ответ пустой.");
    $("aiRec").innerHTML = treeHTML(eroot, false) || "—";
    $("aiNote").textContent = r.verdict === 2 ? "" : "Если считаешь, что записал правильно (например, в другой форме), поменяй оценку.";
    document.querySelectorAll(".g").forEach(b => { b.querySelector(".sug").textContent = !gaveUp && +b.dataset.r === r.verdict ? "· авто" : ""; });
    setGrade(r.verdict);
  }
  $("reveal").scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function commit() {
  if (grade === null) return;
  record(current.id, grade);
  sessionStats.n++; if (grade === 2) sessionStats.ok++; if (grade === 1) sessionStats.mid++;
  renderSession(); nextQuestion();
}
function renderSession() {
  const s = sessionStats, el = $("session");
  if (!s.n) { el.innerHTML = `<span>В базе ${F.length} формул по ${SECTIONS.length} разделам</span>`; return; }
  el.innerHTML = `<span>За сессию: <b>${s.n}</b></span><span>верно <b>${s.ok}</b></span><span>с недочётом <b>${s.mid}</b></span><span>неверно <b>${s.n - s.ok - s.mid}</b></span>`;
}
$("checkBtn").onclick = () => reveal(false);
$("giveUp").onclick = () => reveal(true);
$("nextBtn").onclick = commit;
document.querySelectorAll(".g").forEach(b => b.onclick = () => setGrade(+b.dataset.r));

const secSel = $("secSel");
secSel.innerHTML = `<option value="all">Все разделы</option>` + SECTIONS.map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
secSel.value = secFilter;
secSel.onchange = () => { secFilter = secSel.value; prefs.sec = secFilter; savePrefs(); recent = []; nextQuestion(); };
function syncMode() { $("modeRand").setAttribute("aria-pressed", mode === "rand"); $("modeWeak").setAttribute("aria-pressed", mode === "weak"); }
$("modeRand").onclick = () => { mode = "rand"; prefs.mode = mode; savePrefs(); syncMode(); };
$("modeWeak").onclick = () => { mode = "weak"; prefs.mode = mode; savePrefs(); syncMode(); };
syncMode();

document.addEventListener("keydown", e => {
  if (activeView !== "train" || e.target.tagName === "SELECT") return;
  if (phase === "draw" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const k = e.key, map = { "/": () => eIns({ t: "frac", a: [], b: [] }), "_": () => eIns({ t: "sub", a: [] }), "^": () => eIns({ t: "sup", a: [] }),
      "ArrowLeft": eLeft, "ArrowRight": eRight, "Backspace": eBack, "Tab": eRight };
    if (map[k]) { e.preventDefault(); map[k](); return; }
    if (k.length === 1 && /[\p{L}\d()+=|%*-]/u.test(k)) { e.preventDefault(); eIns({ t: "c", c: k === "-" ? "−" : k === "*" ? "·" : k }); return; }
  }
  if (e.key === "Enter") { e.preventDefault(); if (phase === "draw") reveal(false); else commit(); }
  if (phase === "reveal" && ["1","2","3"].includes(e.key)) setGrade({ "1": 2, "2": 1, "3": 0 }[e.key]);
});

/* ---------- Статистика ---------- */
const band = sc => sc === null ? "none" : sc >= 0.8 ? "ok" : sc >= 0.5 ? "mid" : "bad";
function secAgg(sec) {
  let n = 0, ok = 0, mid = 0, bad = 0, seen = 0;
  for (const f of F) if (f.sec === sec) { const s = state.f[f.id]; if (s) { n += s.n; ok += s.ok; mid += s.mid; bad += s.bad; seen++; } }
  return { n, ok, mid, bad, seen, total: RAW[sec].length };
}
function streak() {
  let d = new Date(), k = 0;
  if (!state.days[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (state.days[dayKey(d)]) { k++; d.setDate(d.getDate() - 1); }
  return k;
}
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
function renderStats() {
  const el = $("view-stats");
  const all = Object.values(state.f);
  const tot = all.reduce((a, s) => a + s.n, 0), ok = all.reduce((a, s) => a + s.ok, 0), mid = all.reduce((a, s) => a + s.mid, 0);
  const acc = tot ? Math.round((ok + mid * .5) / tot * 100) : null;
  const tiles = `<div class="tiles">
    <div class="card tile"><div class="v">${tot}</div><div class="k">${plural(tot,"попытка","попытки","попыток")} всего</div></div>
    <div class="card tile"><div class="v">${acc === null ? "—" : acc + "%"}</div><div class="k">точность (недочёт = ½)</div></div>
    <div class="card tile"><div class="v">${streak()}</div><div class="k">${plural(streak(),"день","дня","дней")} подряд</div></div>
    <div class="card tile"><div class="v">${all.length}<span style="font-size:.9rem;color:var(--muted)"> / ${F.length}</span></div><div class="k">формул встречалось</div></div>
  </div>`;
  if (!tot) {
    el.innerHTML = tiles + `<div class="card sec"><h2>Здесь появится ваша статистика</h2>
      <p class="empty">Решите несколько формул во вкладке «Тренировка». Тут будет видно точность по разделам, формулы, на которых вы чаще всего ошибаетесь, и активность по дням.</p>
      <div><button class="btn primary" id="goTrain">Начать тренировку</button></div></div>`;
    $("goTrain").onclick = () => show("train"); return;
  }
  const secRows = SECTIONS.map(([k, name]) => ({ k, name, ...secAgg(k) }))
    .sort((a, b) => (a.n ? (a.ok + a.mid * .5) / a.n : 2) - (b.n ? (b.ok + b.mid * .5) / b.n : 2));
  const rows = secRows.map(r => {
    if (!r.n) return `<div class="row"><span class="nm">${r.name}</span><div class="bar"></div><span class="num">не решали</span></div>`;
    const p = x => (x / r.n * 100).toFixed(1) + "%";
    const a = Math.round((r.ok + r.mid * .5) / r.n * 100);
    return `<div class="row"><span class="nm" title="${r.name}">${r.name}</span>
      <div class="bar" title="верно ${r.ok}, с недочётом ${r.mid}, неверно ${r.bad}"><i style="width:${p(r.ok)};background:var(--ok)"></i><i style="width:${p(r.mid)};background:var(--mid)"></i><i style="width:${p(r.bad)};background:var(--bad)"></i></div>
      <span class="num"><b>${a}%</b> · ошибок ${r.bad + r.mid}</span></div>`;
  }).join("");
  const weak = F.map(f => ({ f, s: state.f[f.id] })).filter(x => x.s && x.s.ok < x.s.n)
    .sort((a, b) => score(a.s) - score(b.s) || b.s.n - a.s.n).slice(0, 8);
  const weakHtml = weak.length ? weak.map(({ f, s }) => `<div class="wk"><div class="t">${esc(f.q)}<small>${SEC_NAME[f.sec]}</small></div>
      <span class="pill ${band(score(s))}">${s.ok}/${s.n}</span><div class="fx">${fx(f.src)}</div></div>`).join("")
    : `<p class="empty">Ошибок пока нет. Отлично!</p>`;
  // активность за 14 дней
  const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push({ d, v: state.days[dayKey(d)] || { n: 0, ok: 0, mid: 0 } }); }
  const max = Math.max(4, ...days.map(x => x.v.n)), H = 70, W = 20;
  const bars = days.map((x, i) => {
    const h = x.v.n / max * H, hOk = x.v.ok / max * H, hMid = x.v.mid / max * H, X = i * W + 4;
    return `<rect x="${X}" y="${10 + H - h}" width="${W - 6}" height="${h}" rx="2" fill="var(--bad)"/>
      <rect x="${X}" y="${10 + H - hOk - hMid}" width="${W - 6}" height="${hMid}" fill="var(--mid)"/>
      <rect x="${X}" y="${10 + H - hOk}" width="${W - 6}" height="${hOk}" fill="var(--ok)"/>
      ${x.v.n ? `<text x="${X + (W - 6) / 2}" y="${6 + H - h}" text-anchor="middle">${x.v.n}</text>` : `<rect x="${X}" y="${H + 9}" width="${W - 6}" height="1" fill="var(--line)"/>`}
      <text x="${X + (W - 6) / 2}" y="${H + 22}" text-anchor="middle">${x.d.getDate()}</text>`;
  }).join("");
  const mistakes = state.log.filter(l => l.r < 2 && BY_ID[l.id]).slice(-6).reverse();
  const mistHtml = mistakes.length ? mistakes.map(l => { const f = BY_ID[l.id], dt = new Date(l.t);
      return `<div class="wk"><div class="t">${esc(f.q)}<small>${SEC_NAME[f.sec]} · ${dt.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}, ${dt.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</small></div>
      <span class="pill ${l.r === 1 ? "mid" : "bad"}">${l.r === 1 ? "недочёт" : "ошибка"}</span></div>`; }).join("")
    : `<p class="empty">Пока без ошибок.</p>`;
  el.innerHTML = tiles + `
   <div class="card sec"><header><h2>Разделы</h2><span>сначала самые слабые</span></header>
     <div class="legend"><span><i style="background:var(--ok)"></i>верно</span><span><i style="background:var(--mid)"></i>с недочётом</span><span><i style="background:var(--bad)"></i>неверно</span></div>
     <div class="rows">${rows}</div></div>
   <div class="card sec"><header><h2>Повторить в первую очередь</h2><span>верных из попыток</span></header><div class="weak">${weakHtml}</div>
     ${weak.length ? `<div><button class="btn" id="drillWeak">Тренировать слабые</button></div>` : ""}</div>
   <div class="card sec"><header><h2>Активность</h2><span>последние 14 дней</span></header>
     <svg class="chart" viewBox="0 0 ${14 * W + 2} ${H + 28}" role="img" aria-label="Число попыток по дням">${bars}</svg></div>
   <div class="card sec"><header><h2>Последние ошибки</h2></header><div class="weak">${mistHtml}</div></div>
   <div class="danger" id="danger"><button class="btn warn" id="resetBtn">Сбросить статистику</button></div>`;

  const dw = $("drillWeak"); if (dw) dw.onclick = () => { mode = "weak"; prefs.mode = mode; secFilter = "all"; secSel.value = "all"; prefs.sec = "all"; savePrefs(); syncMode(); recent = []; nextQuestion(); show("train"); };
  $("resetBtn").onclick = () => {
    $("danger").innerHTML = `<span>Удалить все ${tot} ${plural(tot,"попытку","попытки","попыток")} без возможности восстановить?</span><button class="btn warn" id="resetYes">Да, сбросить</button><button class="btn" id="resetNo">Отмена</button>`;
    $("resetYes").onclick = () => { state = blank(); persist(); sessionStats = { n: 0, ok: 0, mid: 0 }; renderSession(); renderStats(); };
    $("resetNo").onclick = renderStats;
  };
}

/* ---------- Справочник ---------- */
function renderRef() {
  $("view-ref").innerHTML = SECTIONS.map(([k, name]) => `<div class="card"><h2>${name}</h2>${
    F.filter(f => f.sec === k).map(f => { const s = state.f[f.id];
      return `<div class="ri"><div class="t">${esc(f.q)}</div><span class="go">${s ? `<span class="pill ${band(score(s))}">${s.ok}/${s.n}</span>` : `<span class="pill none">не было</span>`}</span><div class="fx">${fx(f.src)}</div></div>`; }).join("")
  }</div>`).join("");
}

/* ---------- Вкладки ---------- */
let activeView = "train";
function show(v) {
  activeView = v;
  for (const x of ["train", "stats", "ref"]) { $("view-" + x).hidden = x !== v; $("tab-" + x).setAttribute("aria-selected", String(x === v)); }
  if (v === "stats") renderStats(); if (v === "ref") renderRef();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.view));
function refreshAll() { if (activeView === "stats") renderStats(); if (activeView === "ref") renderRef(); if (current && phase === "draw") $("qHist").textContent = histText(current.id); }

renderSession();
nextQuestion();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
